<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KidsTown Toystore: Shape Poems</title>
<link rel="stylesheet" href="../assets/style.css">
<script>window.PAGE_DEPTH = 1;</script>
<script src="../assets/nav.js" defer></script>
<script src="shape-data.js" defer></script>
<style>body { background: yellow; }</style>
</head>
<body>

<div id="nav-bar"></div>

<div class="page center" id="content">Loading...</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const GFX = "../../graphics/toystore/";
  const ORDINALS = ["1st", "2nd", "3rd", "4th", "5th"];
  const n = Math.min(Math.max(Number(new URLSearchParams(window.location.search).get("n")) || 1, 1), SHAPES.length);
  const shape = SHAPES[n - 1];
  const container = document.getElementById("content");
  const isLast = n === SHAPES.length;

  const nav =
    SHAPES.map((_, i) => {
      const num = i + 1;
      return num === n ? "<b>" + ORDINALS[i] + "</b>" : '<a href="shape.html?n=' + num + '">' + ORDINALS[i] + "</a>";
    }).join(" ") +
    '<br><a href="riddle.html?n=1">Riddles</a> &nbsp; <a href="bonus.html">Problem</a>';

  function renderQuestion() {
    document.title = "KidsTown: Toystore: Shape Poem " + n;
    container.innerHTML =
      "<h1>YOUR " + (n === 1 ? "FIRST" : ORDINALS[n - 1].toUpperCase()) + " SHAPE POEM:</h1>" +
      '<p><img src="' + GFX + shape.img + '" alt=""></p>' +
      "<h2>What shape do you see?</h2>" +
      '<p><a href="#" id="reveal">Click here for the answer.</a></p>' +
      "<p>Shape Poems &rarr; " + nav + "</p>";

    document.getElementById("reveal").addEventListener("click", (e) => {
      e.preventDefault();
      renderAnswer();
    });
  }

  function renderAnswer() {
    const nextHref = isLast ? "bonus.html" : "shape.html?n=" + (n + 1);
    const nextLabel = isLast ? "Click here to read the problem." : "Click here for your next shape poem.";
    container.innerHTML =
      "<h1>" + shape.answerTitle + "</h1>" +
      '<table style="margin:0 auto;"><tr>' +
      '<td><img src="' + GFX + shape.img + '" alt=""></td>' +
      '<td style="text-align:left; padding-left:1em;"><font size="+1">' + shape.answerPoem + "</font></td>" +
      "</tr></table>" +
      '<p><a href="' + nextHref + '">' + nextLabel + "</a></p>";
  }

  renderQuestion();
});
</script>

</body>
</html>
