<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KidsTown Library: Word Search</title>
<link rel="stylesheet" href="../assets/style.css">
<script>window.PAGE_DEPTH = 1;</script>
<script src="../assets/nav.js" defer></script>
<script src="wordsearch-data.js" defer></script>
<style>body { background: #A2F9CD; }</style>
</head>
<body>

<div id="nav-bar"></div>

<div class="page" id="content">Loading...</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const GFX = "../../graphics/library/";
  const key = new URLSearchParams(window.location.search).get("state");
  const ws = WORDSEARCHES[key];
  const container = document.getElementById("content");

  if (!ws) {
    container.innerHTML = '<p>Unknown puzzle. <a href="index.html">Back to the Library</a>.</p>';
    return;
  }

  document.title = "KidsTown Library: " + ws.state + " Word Search";

  let showingAnswer = false;

  function render() {
    const img = showingAnswer ? ws.answerImg : ws.puzzleImg;
    const heading = showingAnswer ? "Let's see how many you found!" : ws.title;
    const toggleLabel = showingAnswer ? "Return to Puzzle" : "Puzzle Solution";

    container.innerHTML =
      '<h1 class="center">KidsTown Library: ' + ws.state + " Word Search</h1>" +
      '<h3 class="center">' + heading + "</h3>" +
      '<p class="center"><img src="' + GFX + img + '" width="' + ws.width + '" height="' + ws.height + '" alt="Word search"></p>' +
      "<hr>" +
      "<ol>" + ws.clues.map((c) => "<li>" + c + "</li>").join("") + "</ol>" +
      '<p class="center"><a href="#" id="toggle"><b>' + toggleLabel + "</b></a></p>" +
      '<p class="center"><a href="index.html">Back To U.S. Map</a></p>';

    document.getElementById("toggle").addEventListener("click", (e) => {
      e.preventDefault();
      showingAnswer = !showingAnswer;
      render();
    });
  }

  render();
});
</script>

</body>
</html>
