<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KidsTown School: Farm Field-Trip</title>
<link rel="stylesheet" href="../../assets/style.css">
<script>window.PAGE_DEPTH = 2;</script>
<script src="../../assets/nav.js" defer></script>
<script src="farmnav.js" defer></script>
<script src="farm-data.js" defer></script>
<style>body { background: #99FF99; } #detail img { max-width: 100%; }</style>
</head>
<body>

<div id="nav-bar"></div>

<div class="page center">
  <div id="farm-nav"></div>
  <hr>
  <div id="detail">Loading...</div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const GFX = "../../graphics/school/";
  const params = new URLSearchParams(window.location.search);
  const type = params.get("type") === "crops" ? "crops" : "animals";
  const table = type === "crops" ? CROPS : ANIMALS;
  const id = params.get("id");
  const entry = table[id];
  const container = document.getElementById("detail");

  if (!entry) {
    container.innerHTML = '<p>Not found. <a href="index.html">Back to the Farm.</a></p>';
    return;
  }

  document.title = "KidsTown School: Farm Field-Trip: " + entry.title;

  const others = Object.keys(table)
    .filter((key) => key !== id)
    .map((key) => '<a href="detail.html?type=' + type + '&id=' + key + '">' + table[key].label + "</a>")
    .join("&nbsp;&nbsp;");

  container.innerHTML =
    "<h1>" + entry.title + "</h1>" +
    '<font size="+1">' + entry.html.replace(/src="([^"]+)"/g, 'src="' + GFX + '$1"') + "</font>" +
    '<p><font size="+1">Which ' + (type === "crops" ? "crop" : "animal") + " should we visit next?<br>" + others + "</font></p>";
});
</script>

</body>
</html>
