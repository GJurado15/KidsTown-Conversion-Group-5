<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KidsTown Museum - Planetarium</title>
<link rel="stylesheet" href="../../assets/style.css">
<script>window.PAGE_DEPTH = 2;</script>
<script src="../../assets/nav.js" defer></script>
<script src="quiz-data.js" defer></script>
<style>
  body { background: black; color: white; }
  a { color: yellow; }
  #quiz { max-width: 640px; margin: 0 auto; text-align: center; }
  #choices { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 1em 0; }
  #choices button { background: none; border: 3px solid transparent; padding: 0; cursor: pointer; }
  #choices button:disabled { cursor: default; opacity: 0.4; }
  #choices button.correct { border-color: limegreen; }
  #choices button.incorrect { border-color: crimson; }
  #choices img { display: block; }
  #controls a { display: inline-block; margin: 0 10px; }
</style>
</head>
<body>

<div id="nav-bar"></div>

<div class="page">
  <p class="center"><a href="help.html">Help</a> &middot; <a href="index.html">Change tour</a></p>
  <div id="quiz" class="center"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const GFX = "../../graphics/museum/";
  const tour = new URLSearchParams(window.location.search).get("tour") === "advanced" ? "advanced" : "basic";
  const questions = QUIZ_TOURS[tour];
  const storageKey = "planetarium_played_" + tour;
  const quiz = document.getElementById("quiz");

  function getPlayed() {
    try {
      return JSON.parse(sessionStorage.getItem(storageKey)) || [];
    } catch (e) {
      return [];
    }
  }

  function setPlayed(played) {
    sessionStorage.setItem(storageKey, JSON.stringify(played));
  }

  function pickQuestion() {
    const played = getPlayed();
    const unplayed = questions.map((_, i) => i).filter((i) => !played.includes(i));

    if (unplayed.length === 0) {
      renderStartOver();
      return;
    }

    const index = unplayed[Math.floor(Math.random() * unplayed.length)];
    renderQuestion(index, []);
  }

  function renderQuestion(index, wrongTried) {
    const q = questions[index];
    quiz.innerHTML =
      '<font size="+2">' + q.question + "</font>" +
      '<div id="choices"></div>' +
      '<p><b>Click on one of the images.</b></p>' +
      '<p><a href="#" id="skip">SKIP THIS QUESTION</a></p>';

    const choicesEl = document.getElementById("choices");
    q.choices.forEach((choice, i) => {
      const btn = document.createElement("button");
      btn.innerHTML = '<img src="' + GFX + choice.img + '" alt="">';
      if (wrongTried.includes(i)) {
        btn.disabled = true;
        btn.classList.add("incorrect");
      }
      btn.addEventListener("click", () => {
        if (choice.correct) {
          const played = getPlayed();
          played.push(index);
          setPlayed(played);
          renderAnswer(choice, true, index, wrongTried);
        } else {
          renderAnswer(choice, false, index, wrongTried.concat(i));
        }
      });
      choicesEl.appendChild(btn);
    });

    document.getElementById("skip").addEventListener("click", (e) => {
      e.preventDefault();
      const played = getPlayed();
      played.push(index);
      setPlayed(played);
      pickQuestion();
    });
  }

  function renderAnswer(choice, correct, index, wrongTried) {
    quiz.innerHTML =
      '<img src="' + GFX + choice.img + '" alt=""><br><br>' +
      '<font size="+1">' + choice.text + "</font><br><br>" +
      '<div id="controls"></div>';

    const controls = document.getElementById("controls");

    const nextLink = document.createElement("a");
    nextLink.href = "#";
    if (correct) {
      nextLink.innerHTML = '<img src="' + GFX + 'newquest.gif" alt="New Question">';
      nextLink.addEventListener("click", (e) => { e.preventDefault(); pickQuestion(); });
    } else {
      nextLink.innerHTML = '<img src="' + GFX + 'tryagain.gif" alt="Try Again">';
      nextLink.addEventListener("click", (e) => { e.preventDefault(); renderQuestion(index, wrongTried); });
    }
    controls.appendChild(nextLink);

    if (!correct) {
      const skipLink = document.createElement("a");
      skipLink.href = "#";
      skipLink.textContent = "SKIP THIS QUESTION";
      skipLink.addEventListener("click", (e) => {
        e.preventDefault();
        const played = getPlayed();
        played.push(index);
        setPlayed(played);
        pickQuestion();
      });
      controls.appendChild(document.createElement("br"));
      controls.appendChild(document.createElement("br"));
      controls.appendChild(skipLink);
    }
  }

  function renderStartOver() {
    quiz.innerHTML =
      '<font size="+1">You\'ve answered all the questions in this category.<br>' +
      "Select \"New Question\" to start over.</font><br><br>" +
      '<a href="#" id="start-over"><img src="' + GFX + 'newquest.gif" alt="New Question"></a>';
    document.getElementById("start-over").addEventListener("click", (e) => {
      e.preventDefault();
      setPlayed([]);
      pickQuestion();
    });
  }

  pickQuestion();
});
</script>

</body>
</html>
