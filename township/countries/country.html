<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KidsTown Township: Country</title>
<link rel="stylesheet" href="../../assets/style.css">
<script>window.PAGE_DEPTH = 2;</script>
<script src="../../assets/nav.js" defer></script>
<script src="country-data.js" defer></script>
</head>
<body>

<div id="nav-bar"></div>

<div class="page" id="content">Loading...</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const GFX = "../../graphics/township/";
  const id = new URLSearchParams(window.location.search).get("id");
  const c = COUNTRIES[id];
  const container = document.getElementById("content");

  if (!c) {
    container.innerHTML = '<p>Unknown country. <a href="index.html">Back to the game</a>.</p>';
    return;
  }

  document.title = "KidsTown Township: " + c.name;

  const images = c.images.map((img) => '<img src="' + GFX + img + '" alt="' + c.name + '" style="margin: 0 10px;">').join("");
  const facts = c.facts.map((f) => "<li><font size=\"+1\">" + f + "</font></li>").join("");
  const nextLink = c.isLast
    ? "<h3>That's all for now! Thanks for playing!</h3><h4>Now choose another part of KidsTown to visit:</h4>"
    : '<h3><a href="round.html?id=' + c.round + '">Go back to the game!</a></h3>';

  container.innerHTML =
    '<p><font size="+2">' + c.intro + "</font></p>" +
    '<p style="text-align:center;">' + images + "</p>" +
    '<p><font size="+2">Did you know?</font></p>' +
    "<ul>" + facts + "</ul>" +
    nextLink;
});
</script>

</body>
</html>
